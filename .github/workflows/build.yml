name: Build SaikiMotion IPA

"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA for LiveContainer
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install xtool
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xtool-org/tap/xtool

      - name: Show toolchain versions
        run: |
          echo "--- xtool ---"
          xtool --help || true
          echo "--- iOS SDK ---"
          xcrun -sdk iphoneos -show-sdk-path

      - name: Locate xtool project (root or nested folder)
        id: project
        run: |
          if [ -f Package.swift ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Project is at the repo root."
          else
            PKG="$(find . -name Package.swift -not -path './.git/*' | head -n 1)"
            if [ -z "$PKG" ]; then
              echo "ERROR: no Package.swift anywhere in this repo."
              echo "The source files did not upload — if a .zip file was"
              echo "uploaded, delete it and upload the EXTRACTED contents."
              exit 1
            fi
            DIR="$(dirname "$PKG")"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "Project found nested in: $DIR (building there instead)"
            ls -la "$DIR"
          fi

      - name: Build unsigned IPA
        working-directory: ${{ steps.project.outputs.dir }}
        run: xtool dev build --ipa

      - name: Collect IPA (any output location)
        run: |
          mkdir -p dist
          IPA="$(find . -name '*.ipa' -not -path './dist/*' | head -n 1)"
          if [ -z "$IPA" ]; then
            echo "ERROR: no .ipa was produced — check the build log above"
            exit 1
          fi
          cp "$IPA" "dist/SaikiMotion-1.5.23-unsigned.ipa"
          echo "Built: $IPA -> dist/SaikiMotion-1.5.23-unsigned.ipa"
          ls -la dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-1.5.23-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
