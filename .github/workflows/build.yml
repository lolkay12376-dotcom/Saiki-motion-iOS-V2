# Build SaikiMotion .ipa with Xcode — no Mac, no Xcode GUI needed.
#
# v9:
#   • REPO SELF-TIDY: after every run (success OR failure) the workflow
#     deletes superseded files from the repo — every old Saiki zip, every
#     stray README.md, anything that is not the zip that was just built
#     or the .github/ workflow itself. The commit message carries
#     "[skip ci]" so the cleanup push does not re-trigger this workflow.
#     Keeps the repo file list tiny (2 entries) so it stops crashing the
#     GitHub app on a phone. Runs only when building from an uploaded
#     zip; extracted-root sources are never touched. Best-effort:
#     continue-on-error, so a denied push can never redden the build.
# v8:
#   • ERROR SUMMARY REORDERED: the real "error:" lines are now the LAST
#     thing in the log, right above "Error: Process completed" — so
#     copying from the bottom of the step log always captures them.
#     (v7 printed them first; they kept getting missed when copying.)
#   • On failure the full xcodebuild.log is ALSO uploaded as an artifact
#     ("xcodebuild-failure-log") — open it in the browser/GitHub app and
#     search for "error:" if copying from the log view ever fails again.
#   • Errors are no longer sorted: they stay in build order (easier to
#     read), capped at 60, with a count.
#   • Zip picking is unchanged from v7: version-ranked, highest wins
#     (1.5.23fix2 > 1.5.23fix1 > 1.5.23 > no version; padded so 1.5.10
#     beats 1.5.9), optional manual "zip_name" override, chosen zip is
#     echoed in the log.
#
# Build: xcodegen generate → xcodebuild (unsigned) → Payload/ → .ipa
# Unsigned is CORRECT for LiveContainer (LC signs on import).

name: Build SaikiMotion IPA

# "on" is quoted on purpose — bare `on:` is read as boolean `true`
# by YAML 1.1 parsers (a classic silent-workflow-never-runs failure).
"on":
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip to build (exact name or glob). Empty = auto-pick the best Saiki*.zip.'
        required: false
        default: ''

jobs:
  build-ipa:
    name: Build unsigned IPA with Xcode
    runs-on: macos-15
    timeout-minutes: 30
    # The tidy-up step needs to push a deletion commit. Nothing else
    # uses the extra scope; a denied push is tolerated (continue-on-error).
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          # Skip brew's self-update: minutes saved, fewer failure modes.
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Show toolchain versions
        run: |
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- XcodeGen ---"
          xcodegen --version

      - name: Locate sources (root, nested, or inside a zip)
        id: project
        env:
          # Optional manual override (workflow_dispatch input; empty on push).
          ZIP_PATTERN: ${{ github.event.inputs.zip_name }}
        run: |
          DIR=""

          # Case 1: project.yml + Sources at the repo root
          if [ -f project.yml ] && [ -d Sources ]; then
            DIR="."
            echo "Found project.yml + Sources at the repo root."

          else
            # Case 2: project.yml + Sources nested in a folder
            SPEC="$(find . -name project.yml -not -path './.git/*' -not -path './unpacked/*' | head -n 1)"
            if [ -n "$SPEC" ] && [ -d "$(dirname "$SPEC")/Sources" ]; then
              DIR="$(dirname "$SPEC")"
              echo "Found project nested in: $DIR"

            else
              # Case 3: unpack a zip.
              # Pattern: the manual "zip_name" input if given, else any zip
              # whose name starts with "Saiki" (case-insensitive).
              PATTERN="${ZIP_PATTERN:-saiki*.zip}"
              MANUAL="no"
              if [ -n "$ZIP_PATTERN" ]; then MANUAL="yes"; fi
              echo "Zip search pattern: $PATTERN"

              CANDS="$(find . -iname "$PATTERN" -not -path './.git/*' -not -path './unpacked/*' | sort -f)"
              if [ -z "$CANDS" ] && [ "$MANUAL" = "no" ]; then
                echo "(no Saiki*.zip found — falling back to any .zip)"
                CANDS="$(find . -name '*.zip' -not -path './.git/*' -not -path './unpacked/*' | sort -f)"
              fi
              if [ -z "$CANDS" ] && [ "$MANUAL" = "yes" ]; then
                echo "NOTE: you asked for zip pattern '$PATTERN' — no file in the repo matches it."
              fi

              if [ -n "$CANDS" ]; then
                # Rank candidates: by the version token in the name
                # (numbers zero-padded so 1.5.10 > 1.5.9), then by name.
                # Zips with no version in the name rank lowest. Uses only
                # POSIX awk/sort — same behavior on macOS and Linux.
                RANKED="$(printf '%s\n' "$CANDS" | while IFS= read -r z; do
                  key="$(printf '%s' "$z" | awk '{
                    s = tolower($0); v = ""
                    while (match(s, /[0-9]+(\.[0-9]+)*(fix[0-9]+)?/)) {
                      v = substr(s, RSTART, RLENGTH)
                      s = substr(s, RSTART + RLENGTH)
                    }
                    if (v == "") { print "00000000000000000000"; next }
                    out = ""
                    while (match(v, /[0-9]+/)) {
                      pre = substr(v, 1, RSTART - 1)
                      num = substr(v, RSTART, RLENGTH)
                      while (length(num) < 8) num = "0" num
                      out = out pre num
                      v = substr(v, RSTART + RLENGTH)
                    }
                    print out v
                  }')"
                  printf '%s\t%s\n' "$key" "$z"
                done | sort -t "$(printf '\t')" -k1,1r -k2,2f)"

                echo "Saiki zip candidates (top one is built):"
                printf '%s\n' "$RANKED" | cut -f2- | sed 's/^/  /'
                ZIPF="$(printf '%s\n' "$RANKED" | head -n 1 | cut -f2-)"
                echo "zipfile=$ZIPF" >> "$GITHUB_OUTPUT"

                echo ">>> BUILDING FROM ZIP: $ZIPF"
                mkdir -p unpacked
                unzip -q -o "$ZIPF" -d unpacked
                SPEC="$(find unpacked -name project.yml | head -n 1)"
                if [ -n "$SPEC" ] && [ -d "$(dirname "$SPEC")/Sources" ]; then
                  DIR="$(dirname "$SPEC")"
                  echo "Using sources from inside $ZIPF ($DIR)"
                else
                  echo "NOTE: $ZIPF unpacked, but contains no project.yml + Sources — not usable."
                fi
              fi
            fi
          fi

          # Case 4: nothing usable — show what IS in the repo, then fail
          if [ -z "$DIR" ]; then
            echo "ERROR: the SaikiMotion sources are not in this repo."
            echo ""
            echo "The repo currently contains ONLY these files:"
            echo "--------------------------------------------------------------"
            find . -not -path './.git/*' -not -path './unpacked/*' -type f -print | sed 's|^\./||' | head -60
            echo "--------------------------------------------------------------"
            echo ""
            echo "HOW TO FIX (pick ONE — both take under a minute):"
            echo " A) EASIEST: 'Add file' > 'Upload files' > drag in a zip whose"
            echo "    name starts with 'Saiki' (e.g. SaikiMotion-source zip)"
            echo "    > Commit. This workflow unpacks the zip and builds it."
            echo " B) Or upload the EXTRACTED contents of that zip: Sources/,"
            echo "    native/, project.yml, Info.plist, .github/."
            echo "    (GitHub does NOT unzip files on upload.)"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Generate Xcode project
        working-directory: ${{ steps.project.outputs.dir }}
        run: xcodegen generate

      - name: Build unsigned app (xcodebuild)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -o pipefail
          LOG="xcodebuild.log"
          if xcodebuild -project SaikiMotion.xcodeproj \
                        -scheme SaikiMotion \
                        -configuration Release \
                        -destination 'generic/platform=iOS' \
                        -derivedDataPath build \
                        CODE_SIGNING_ALLOWED=NO \
                        CODE_SIGNING_REQUIRED=NO \
                        CODE_SIGN_IDENTITY="" \
                        build 2>&1 | tee "$LOG"; then
            echo "BUILD OK"
          else
            echo ""
            echo "=============================================================="
            echo " BUILD FAILED - ERROR SUMMARY"
            echo " The ERRORS are at the very BOTTOM of this section, between"
            echo " the ### marker lines - copy from there upward."
            echo "=============================================================="
            echo "---- warnings (max 10, usually harmless C-library noise) -----"
            grep -E "warning:" "$LOG" | sort -u | head -10 || echo "(none)"
            echo "---- failed build commands -----------------------------------"
            sed -n '/The following build commands failed/,/^$/p' "$LOG" | head -25
            echo "---- last 25 lines of the build log (context) ----------------"
            tail -25 "$LOG"
            echo ""
            echo "##############################################################"
            echo "###  THE ACTUAL ERRORS - START COPYING HERE  #################"
            echo "##############################################################"
            grep "error:" "$LOG" | head -60
            EC="$(grep -c "error:" "$LOG" || true)"
            if [ "$EC" = "0" ]; then
              echo "(no lines contain 'error:' - instead paste the 25 context lines above)"
            else
              echo "( $EC error lines total )"
            fi
            echo "##############################################################"
            echo "###  END OF ERRORS  ##########################################"
            echo "##############################################################"
            exit 1
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: ${{ steps.project.outputs.dir }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package unsigned IPA
        id: pkg
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APP="$(find build/Build/Products -name '*.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app was produced — check the xcodebuild log above"
            exit 1
          fi
          # Version comes FROM THE BUILT APP, so the artifact name can
          # never drift from what's actually inside the zip.
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || true)"
          if [ -z "$VER" ]; then VER="unknown"; fi
          echo "App version: $VER (read from $APP/Info.plist)"
          mkdir -p Payload "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/dist/SaikiMotion-$VER-unsigned.ipa" Payload
          echo "Packaged: $APP -> dist/SaikiMotion-$VER-unsigned.ipa"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-${{ steps.pkg.outputs.ver }}-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Tidy the repo (keep only the built zip + the workflow)
        # Runs on success AND failure: old zips / stray READMEs get removed
        # either way, so the repo file list stays phone-friendly.
        if: always()
        continue-on-error: true
        run: |
          KEEP_ZIP="$(basename "${{ steps.project.outputs.zipfile }}")"
          if [ -z "$KEEP_ZIP" ] || [ "$KEEP_ZIP" = "." ]; then
            echo "Sources were not uploaded as a zip — leaving the repo untouched."
            exit 0
          fi
          cd "$GITHUB_WORKSPACE"
          TO_DELETE="$(git ls-files | grep -v '^\.github/' | grep -vx "$KEEP_ZIP" || true)"
          if [ -z "$TO_DELETE" ]; then
            echo "Repo is already tidy (only $KEEP_ZIP and .github/)."
            exit 0
          fi
          echo "Removing superseded files:"
          printf '%s\n' "$TO_DELETE" | sed 's/^/  /'
          printf '%s\n' "$TO_DELETE" | while IFS= read -r f; do rm -f -- "$f"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            # [skip ci] stops this push from re-triggering the workflow
            git commit -m "chore: remove superseded files, keep $KEEP_ZIP [skip ci]"
            git push
            echo "Repo tidied — file list is now just $KEEP_ZIP + .github/"
          fi
