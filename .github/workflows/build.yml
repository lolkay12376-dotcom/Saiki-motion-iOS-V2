# Build SaikiMotion .ipa with Xcode — no Mac, no Xcode GUI needed.
#
# v4 — handles the exact failure you hit:
#   "Target CCrashLog has a missing source directory .../Sources/CCrashLog"
#   = project.yml IS in the repo, but the Sources/ folder is NOT.
#   Fix in this version: upload SaikiMotion-source-1.5.23.zip as a FILE
#   (Add file > Upload files > drag the zip) and this workflow UNPACKS IT
#   ITSELF and builds from inside it. No folder-dragging needed anymore.
#
# Locate order:
#   1. project.yml + Sources/ at the repo root        → build at root
#   2. project.yml + Sources/ nested in a folder      → build there
#   3. any .zip in the repo                           → unzip, build inside
#   4. nothing usable                                 → list repo contents
#                                                      and fail with instructions
#
# Build: xcodegen generate → xcodebuild (unsigned) → Payload/ → .ipa
# Unsigned is CORRECT for LiveContainer (LC signs on import).

name: Build SaikiMotion IPA

# "on" is quoted on purpose — bare `on:` is read as boolean `true`
# by YAML 1.1 parsers (a classic silent-workflow-never-runs failure).
"on":
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA with Xcode
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          # Skip brew's self-update: minutes saved, fewer failure modes.
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Show toolchain versions
        run: |
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- XcodeGen ---"
          xcodegen --version

      - name: Locate sources (root, nested, or inside a zip)
        id: project
        run: |
          DIR=""

          # Case 1: project.yml + Sources at the repo root
          if [ -f project.yml ] && [ -d Sources ]; then
            DIR="."
            echo "Found project.yml + Sources at the repo root."

          else
            # Case 2: project.yml + Sources nested in a folder
            SPEC="$(find . -name project.yml -not -path './.git/*' -not -path './unpacked/*' | head -n 1)"
            if [ -n "$SPEC" ] && [ -d "$(dirname "$SPEC")/Sources" ]; then
              DIR="$(dirname "$SPEC")"
              echo "Found project nested in: $DIR"

            else
              # Case 3: a .zip anywhere in the repo — unpack and use it
              ZIPF="$(find . -name '*.zip' -not -path './.git/*' -not -path './unpacked/*' | head -n 1)"
              if [ -n "$ZIPF" ]; then
                echo "No extracted sources found — unpacking $ZIPF"
                mkdir -p unpacked
                unzip -q -o "$ZIPF" -d unpacked
                SPEC="$(find unpacked -name project.yml | head -n 1)"
                if [ -n "$SPEC" ] && [ -d "$(dirname "$SPEC")/Sources" ]; then
                  DIR="$(dirname "$SPEC")"
                  echo "Using sources from inside $ZIPF ($DIR)"
                fi
              fi
            fi
          fi

          # Case 4: nothing usable — show what IS in the repo, then fail
          if [ -z "$DIR" ]; then
            echo "ERROR: the SaikiMotion sources are not in this repo."
            echo ""
            echo "The repo currently contains ONLY these files:"
            echo "--------------------------------------------------------------"
            find . -not -path './.git/*' -not -path './unpacked/*' -type f -print | sed 's|^\./||' | head -60
            echo "--------------------------------------------------------------"
            echo ""
            echo "HOW TO FIX (pick ONE — both take under a minute):"
            echo " A) EASIEST: 'Add file' > 'Upload files' > drag the file"
            echo "    SaikiMotion-source-1.5.23.zip > Commit. This workflow"
            echo "    unpacks the zip itself and builds from inside it."
            echo " B) Or upload the EXTRACTED contents of that zip: Sources/,"
            echo "    native/, docs/, project.yml, Info.plist, Package.swift."
            echo "    (GitHub does NOT unzip files on upload.)"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          ls -la "$DIR"

      - name: Generate Xcode project
        working-directory: ${{ steps.project.outputs.dir }}
        run: xcodegen generate

      - name: Build unsigned app (xcodebuild)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          xcodebuild -project SaikiMotion.xcodeproj \
                     -scheme SaikiMotion \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      - name: Package unsigned IPA
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APP="$(find build/Build/Products -name '*.app' -type d | head -n 1)"
          if [ -z "$APP" ]; then
            echo "ERROR: no .app was produced — check the xcodebuild log above"
            exit 1
          fi
          mkdir -p Payload "$GITHUB_WORKSPACE/dist"
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/dist/SaikiMotion-1.5.23-unsigned.ipa" Payload
          echo "Packaged: $APP -> dist/SaikiMotion-1.5.23-unsigned.ipa"
          ls -la "$GITHUB_WORKSPACE/dist/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaikiMotion-1.5.23-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30
