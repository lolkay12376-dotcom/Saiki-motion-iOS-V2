name: SaikiMotion
options:
  bundleIdPrefix: com.saiki
  createIntermediateGroups: true

targets:
  CCrashLog:
    type: framework.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CCrashLog
    settings:
      base:
        DEFINES_MODULE: "YES"
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: "YES"

  SaikiMotion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "CCrashLog"
          - "CCrashLog/**"
          - "App/EditorViewController.swift"
          - "App/SdkIdeViewController.swift"
          - "UI/Ui.swift"
    dependencies:
      - target: CCrashLog
        embed: false
    settings:
      base:
        PRODUCT_NAME: SaikiMotion
        PRODUCT_BUNDLE_IDENTIFIER: com.saiki.motion.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"

schemes:
  SaikiMotion:
    build:
      targets:
        SaikiMotion: all
