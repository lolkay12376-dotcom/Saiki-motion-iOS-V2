# project.yml — XcodeGen spec for SaikiMotion (this IS "the project.yml").
#
# `xcodegen generate` reads this file and creates SaikiMotion.xcodeproj,
# which xcodebuild (or Xcode.app on a Mac) then builds normally.
# GitHub's macOS runners have Xcode preinstalled, so CI = brew install
# xcodegen + xcodegen generate + xcodebuild. No .xcodeproj is committed;
# it is generated on demand and ignored by git.
#
# Spec syntax verified against XcodeGen's Docs/ProjectSpec.md:
#   • excludes are globs relative to the source `path`
#   • headers default to `public` visibility (framework importable)
#   • `framework.static` + DEFINES_MODULE = Swift-importable C module,
#     statically linked (nothing to embed, nothing extra to sign)
#
# Target layout mirrors Package.swift exactly:
#   • CCrashLog  — signal-safe C crash logger (own module, like SwiftPM)
#   • SaikiMotion — app target; same three files excluded as in Package.swift
#     until the missing sources are recovered (see MISSING-SOURCE.md)

name: SaikiMotion
options:
  bundleIdPrefix: com.saiki
  createIntermediateGroups: true

targets:
  CCrashLog:
    type: framework.static
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/CCrashLog
    settings:
      base:
        DEFINES_MODULE: "YES"
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: "YES"

  SaikiMotion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          # CCrashLog compiles as its own framework target above
          - "CCrashLog"
          - "CCrashLog/**"
          # Not yet present in this repo (MISSING-SOURCE.md) — drop these
          # three lines as each file is recovered:
          - "App/EditorViewController.swift"
          - "App/SdkIdeViewController.swift"
          - "UI/Ui.swift"
    dependencies:
      - target: CCrashLog
        embed: false          # static framework: linked, never embedded
    settings:
      base:
        PRODUCT_NAME: SaikiMotion
        PRODUCT_BUNDLE_IDENTIFIER: com.saiki.motion.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.0"   # Swift 5 language mode (Xcode's valid value)
        TARGETED_DEVICE_FAMILY: "1,2"
        # Unsigned build — exactly what LiveContainer wants (LC signs on
        # import; same as every -unsigned.ipa we shipped).
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"

schemes:
  SaikiMotion:
    build:
      targets:
        SaikiMotion: all
